<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giulietta 1.4T - Cloud App</title>
    <!-- PWA Web App Capable -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e293b">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { alfa: '#990000', alfadark: '#660000' } } }
        }
    </script>

    <!-- Firebase SDK (Compat Version per file singolo HTML) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans pb-20">

    <!-- HEADER / APP BAR -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 px-4 py-3 shadow-md flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="bg-alfa text-white p-2 rounded-lg font-black text-xl shadow select-none">🍀</div>
            <div>
                <h1 class="font-bold text-lg leading-tight select-none">Giulietta 1.4T 120CV</h1>
                <div class="flex items-center gap-1.5">
                    <span id="sync-status" class="w-2 h-2 rounded-full bg-amber-500 inline-block"></span>
                    <p id="sync-text" class="text-[10px] text-slate-400 select-none">Connessione Cloud...</p>
                </div>
            </div>
        </div>
        <div class="bg-slate-700/60 border border-slate-600 px-3 py-1.5 rounded-xl text-right">
            <div class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider select-none">Km Attuali</div>
            <div id="header-km-display" class="font-mono font-bold text-amber-400 text-sm">-- km</div>
        </div>
    </header>

    <!-- NAVIGATION TABS -->
    <nav class="flex bg-slate-800 border-b border-slate-700 text-xs font-semibold text-slate-400 select-none">
        <button onclick="switchTab('plan')" id="tab-btn-plan" class="flex-1 py-3 text-center border-b-2 border-alfa text-alfa font-bold transition">📋 PIANO</button>
        <button onclick="switchTab('logs')" id="tab-btn-logs" class="flex-1 py-3 text-center border-b-2 border-transparent hover:text-slate-200 transition">📜 REGISTRO</button>
        <button onclick="switchTab('settings')" id="tab-btn-settings" class="flex-1 py-3 text-center border-b-2 border-transparent hover:text-slate-200 transition">⚙️ IMPOSTAZIONI / BACKUP</button>
    </nav>

    <!-- MAIN CONTAINER -->
    <main class="max-w-xl mx-auto p-4">

        <!-- TAB 1: PIANO -->
        <section id="tab-plan" class="space-y-4">
            <div class="grid grid-cols-3 gap-2 text-center text-xs select-none">
                <div class="bg-red-950/40 border border-red-800/50 p-2.5 rounded-xl">
                    <div id="cnt-scaduto" class="text-lg font-bold text-red-400">0</div>
                    <div class="text-slate-400 text-[10px] font-semibold">SCADUTI</div>
                </div>
                <div class="bg-amber-950/40 border border-amber-800/50 p-2.5 rounded-xl">
                    <div id="cnt-scadenza" class="text-lg font-bold text-amber-400">0</div>
                    <div class="text-slate-400 text-[10px] font-semibold">IN SCADENZA</div>
                </div>
                <div class="bg-emerald-950/40 border border-emerald-800/50 p-2.5 rounded-xl">
                    <div id="cnt-ok" class="text-lg font-bold text-emerald-400">0</div>
                    <div class="text-slate-400 text-[10px] font-semibold">REGOLARI</div>
                </div>
            </div>

            <div class="flex gap-2">
                <input type="text" id="search-input" oninput="renderPlan()" placeholder="Cerca intervento..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-alfa">
                <select id="filter-area" onchange="renderPlan()" class="bg-slate-800 border border-slate-700 rounded-xl px-2 py-2 text-xs text-slate-300 focus:outline-none">
                    <option value="ALL">Tutte le aree</option>
                    <option value="Motore">Motore</option>
                    <option value="Distribuzione">Distribuzione</option>
                    <option value="Liquidi">Liquidi</option>
                    <option value="Freni e ruote">Freni/Ruote</option>
                    <option value="Elettrico">Elettrico</option>
                    <option value="GPL">GPL</option>
                </select>
            </div>

            <div id="plan-items-container" class="space-y-3"></div>
        </section>

        <!-- TAB 2: REGISTRO -->
        <section id="tab-logs" class="space-y-4 hidden">
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 space-y-3 shadow">
                <h3 class="font-bold text-sm text-slate-200">➕ Registra Nuovo Intervento</h3>
                <form id="log-form" onsubmit="handleAddLog(event)" class="space-y-3">
                    <div>
                        <label class="block text-[10px] text-slate-400 font-semibold mb-1">INTERVENTO</label>
                        <!-- FIX STILE SELECT: text-sm, py-2 e leading-normal risolvono il taglio del testo su Chrome/Edge -->
                        <select id="log-item-name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm leading-normal text-slate-100 focus:outline-none focus:border-alfa"></select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] text-slate-400 font-semibold mb-1">DATA</label>
                            <input type="date" id="log-date" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-100">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-400 font-semibold mb-1">KM VEICOLO</label>
                            <input type="number" id="log-km" required placeholder="62200" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-100">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] text-slate-400 font-semibold mb-1">CHI HA ESEGUITO</label>
                            <input type="text" id="log-who" placeholder="Fai da te / Officina" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-100">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-400 font-semibold mb-1">COSTO (€)</label>
                            <input type="number" step="0.01" id="log-cost" placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-100">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 font-semibold mb-1">NOTE / MARCA RICAMBI</label>
                        <input type="text" id="log-notes" placeholder="Es. Selenia 5W-40, filtro UFI" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-100">
                    </div>
                    <button type="submit" class="w-full bg-alfa hover:bg-alfadark text-white font-bold py-2.5 rounded-lg text-xs transition shadow">SALVA IN CLOUD</button>
                </form>
            </div>

            <div class="space-y-2">
                <h3 class="font-bold text-xs text-slate-400 uppercase tracking-wider px-1">Cronologia Interventi</h3>
                <div id="logs-list-container" class="space-y-2"></div>
            </div>
        </section>

        <!-- TAB 3: IMPOSTAZIONI & BACKUP -->
        <section id="tab-settings" class="space-y-4 hidden">
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 space-y-3 shadow">
                <h3 class="font-bold text-sm text-slate-200">🚘 Parametri Veicolo</h3>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Chilometraggio Attuale Auto</label>
                        <div class="flex gap-2">
                            <input type="number" id="setting-current-km" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-amber-400 font-mono font-bold">
                            <button onclick="updateCurrentKm()" class="bg-slate-700 hover:bg-slate-600 px-4 rounded-lg text-xs font-bold text-slate-200">Aggiorna</button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Km Medi Settimanali</label>
                        <input type="number" id="setting-km-week" onchange="saveSettingsFromForm()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-100">
                    </div>
                </div>
            </div>

            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 space-y-3 shadow">
                <h3 class="font-bold text-sm text-slate-200">💾 Esportazione Locale</h3>
                <button onclick="exportCSV()" class="w-full bg-emerald-700 hover:bg-emerald-600 text-white font-bold py-2.5 rounded-lg text-xs transition">📊 ESPORTA REGISTRO IN CSV (Excel)</button>
                <button onclick="exportJSON()" class="w-full bg-blue-700 hover:bg-blue-600 text-white font-bold py-2.5 rounded-lg text-xs transition">📦 DOWNLOAD BACKUP (JSON)</button>
            </div>
        </section>

    </main>

    <script>
        // ================= FIREBASE CONFIGURATION =================
        const firebaseConfig = {
            apiKey: "AIzaSyA9LSM9EHRE1qoXfMgvxLOc7GrGb6Ib-T8",
            authDomain: "giulietta-manutenzione.firebaseapp.com",
            projectId: "giulietta-manutenzione",
            storageBucket: "giulietta-manutenzione.firebasestorage.app",
            messagingSenderId: "880793650334",
            appId: "1:880793650334:web:aaded736ab7d000288678f",
            measurementId: "G-QVNSE418R1"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const docRef = db.collection('giulietta').doc('maintenance_data');

        // ================= DEFAULT DATA =================
        const DEFAULT_SETTINGS = {
            currentKm: 62200,
            kmPerWeek: 650,
            dueSoonKm: 1500,
            dueSoonDays: 45
        };

        const DEFAULT_ITEMS = [
            { id: 1, area: "Motore", name: "Olio motore + filtro olio", libretto: "15.000 km / 12 mesi", adoptedKm: 10000, adoptedMonths: 12, who: "Fai da te", active: true, notes: "Specifica Fiat 9.55535-S2 / ACEA C3 5W-40." },
            { id: 2, area: "Motore", name: "Candele di accensione", libretto: "30.000 km", adoptedKm: 30000, adoptedMonths: 24, who: "Officina", active: true, notes: "Candele Iridio/Platino T-Jet." },
            { id: 3, area: "Motore", name: "Filtro aria motore", libretto: "30.000 km", adoptedKm: 30000, adoptedMonths: 24, who: "Fai da te", active: true, notes: "Ispezione ad ogni cambio olio." },
            { id: 4, area: "Motore", name: "Filtro abitacolo / antipolline", libretto: "15.000 km / 12 mesi", adoptedKm: 15000, adoptedMonths: 12, who: "Fai da te", active: true, notes: "Carboni attivi." },
            { id: 5, area: "Distribuzione", name: "Kit Distribuzione + Pompa Acqua", libretto: "120.000 km / 60 mesi", adoptedKm: 120000, adoptedMonths: 60, who: "Officina", active: true, notes: "Sostituire assieme al tendicinghia e cinghia servizi." },
            { id: 6, area: "Distribuzione", name: "Cinghia servizi / accessori", libretto: "120.000 km / 60 mesi", adoptedKm: 120000, adoptedMonths: 60, who: "Officina", active: true, notes: "Controllare usura visiva." },
            { id: 7, area: "Liquidi", name: "Liquido raffreddamento (Paraflu UP)", libretto: "Ogni 4-5 anni", adoptedKm: 90000, adoptedMonths: 60, who: "Officina", active: true, notes: "Liquido rosso OAT." },
            { id: 8, area: "Liquidi", name: "Olio cambio manuale (C635)", libretto: "Non previsto", adoptedKm: 90000, adoptedMonths: 72, who: "Officina", active: true, notes: "Consigliato per longevità sincronizzatori." },
            { id: 9, area: "Liquidi", name: "Liquido freni (DOT 4)", libretto: "24 mesi", adoptedKm: null, adoptedMonths: 24, who: "Officina", active: true, notes: "Sostituzione igroscopica a tempo." },
            { id: 10, area: "Freni e ruote", name: "Pastiglie e dischi freno", libretto: "Ad ogni tagliando", adoptedKm: 15000, adoptedMonths: 12, who: "Fai da te", active: true, notes: "Verifica usura visiva." },
            { id: 11, area: "Freni e ruote", name: "Inversione pneumatici", libretto: "15.000 km", adoptedKm: 15000, adoptedMonths: 12, who: "Fai da te", active: true, notes: "Controllo pressione a freddo." },
            { id: 12, area: "Elettrico", name: "Batteria Start&Stop (EFB/AGM)", libretto: "Al bisogno", adoptedKm: null, adoptedMonths: 36, who: "Fai da te", active: true, notes: "Test carica annuale." },
            { id: 13, area: "Documenti", name: "Revisione Ministeriale", libretto: "Ogni 2 anni", adoptedKm: null, adoptedMonths: 24, who: "Centro Revisioni", active: true, notes: "Scadenza entro fine mese." },
            { id: 14, area: "GPL", name: "Filtri impianto GPL", libretto: "15.000 km / 12 mesi", adoptedKm: 15000, adoptedMonths: 12, who: "Officina GPL", active: false, notes: "Attivare se presente impianto GPL." }
        ];

        let state = {
            settings: { ...DEFAULT_SETTINGS },
            items: DEFAULT_ITEMS,
            logs: []
        };

        // ================= UTILS =================
        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&')
                .replace(/</g, '<')
                .replace(/>/g, '>')
                .replace(/"/g, '"')
                .replace(/'/g, ''');
        }

        // ================= REALTIME CLOUD SYNC =================
        docRef.onSnapshot((doc) => {
            if (doc.exists) {
                const cloudData = doc.data();
                state = {
                    settings: { ...DEFAULT_SETTINGS, ...(cloudData.settings || {}) },
                    items: cloudData.items || DEFAULT_ITEMS,
                    logs: cloudData.logs || []
                };
                updateSyncBadge(true);
            } else {
                syncToCloud();
            }
            updateUI();
        }, (error) => {
            console.error("Errore sincronizzazione Cloud:", error);
            updateSyncBadge(false);
        });

        function syncToCloud() {
            updateSyncBadge(null);
            docRef.set(state).then(() => {
                updateSyncBadge(true);
            }).catch((err) => {
                console.error("Errore salvataggio Cloud:",
